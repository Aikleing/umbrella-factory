<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Umbrella Factory | OEM & ODM Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; color: #333; }
        header { background: #2c3e50; color: #fff; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        nav a { color: #fff; margin-left: 20px; text-decoration: none; }
        .btn { background: #e74c3c; color: #fff; padding: 12px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
        .section { padding: 50px 10%; text-align: center; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-top: 40px; }
        .product-card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .contact-form { background: #f4f4f4; padding: 40px 10%; }
        form { display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; text-align: left; }
        input, textarea { margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        footer { background: #2c3e50; color: #fff; padding: 30px 10%; text-align: center; }
        .social-links a { color: #fff; font-size: 24px; margin: 0 15px; text-decoration: none; }
        .whatsapp-float { position: fixed; width: 60px; height: 60px; bottom: 40px; right: 40px; background-color: #25d366; color: #FFF; border-radius: 50px; text-align: center; font-size: 30px; box-shadow: 2px 2px 3px #999; z-index: 100; }
        .whatsapp-float i { margin-top: 16px; }

        .hero { position: relative; height: 80vh; overflow: hidden; color: #fff; text-align: center; }
        .slides { width: 200%; height: 100%; display: flex; animation: slider 12s infinite ease-in-out; }
        .slide { width: 50%; height: 100%; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .slide::before { content: ''; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 1; }
        .slide-content { position: relative; z-index: 2; padding: 0 10%; }
        .slide h1 { font-size: 3.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .slide p { font-size: 1.2rem; margin-bottom: 20px; }
        @keyframes slider {
            0%, 45% { transform: translateX(0); }
            55%, 100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">UmbrellaExpert</div>
        <nav>
            <a href="#about">About</a>
            <a href="#products">Products</a>
            <a href="#contact">Inquiry</a>
        </nav>
